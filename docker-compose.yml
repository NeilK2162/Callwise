# Callwise — full local stack.
# Dev defaults are inlined so `docker compose up --build` works with no .env.
# Providers default to "mock", so no external credentials are required locally.
name: callwise

x-backend-env: &backend-env
  APP_ENV: dev
  LOG_LEVEL: INFO
  BASE_URL: http://webhook-ingest:8001
  DATABASE_URL: postgresql+asyncpg://callwise:callwise@pgbouncer:6432/callwise
  DATABASE_URL_DIRECT: postgresql+asyncpg://callwise:callwise@postgres:5432/callwise
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: dev-only-change-me-to-a-32+char-random-secret
  CONTEXT_TOKEN_SECRET: dev-only-change-me-context-signing-secret
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: callwise
  S3_ACCESS_KEY_ID: callwise
  S3_SECRET_ACCESS_KEY: callwise123
  TELEPHONY_PROVIDER: mock
  CONVERSATION_PROVIDER: mock
  LLM_PROVIDER: mock

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: callwise
      POSTGRES_PASSWORD: callwise
      POSTGRES_DB: callwise
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: callwise
      DB_PASSWORD: callwise
      DB_NAME: callwise
      POOL_MODE: transaction        # multiplex thousands of clients onto few conns (PRD §15.3)
      MAX_CLIENT_CONN: "10000"
      DEFAULT_POOL_SIZE: "50"
      AUTH_TYPE: scram-sha-256
    ports: ["6432:6432"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # AOF on (PRD §8.1)
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: callwise
      MINIO_ROOT_PASSWORD: callwise123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # Applies migrations against the DIRECT Postgres connection, then exits.
  migrate:
    build: { context: ./backend }
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Seeds the demo clinic dashboard + demo user (demo@callwise.local / demo12345) so the
  # dashboard's auto-login works and the feed is alive on first load.
  seed:
    build: { context: ./backend }
    command: ["uv", "run", "python", "-m", "callwise.scripts.seed_demo"]
    environment: *backend-env
    depends_on:
      pgbouncer: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    restart: "no"

  control-api:
    build: { context: ./backend }
    command: ["uv", "run", "uvicorn", "callwise.control_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  webhook-ingest:
    build: { context: ./backend }
    command: ["uv", "run", "uvicorn", "callwise.webhook_ingest.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *backend-env
    ports: ["8001:8001"]
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  dialer-worker:
    build: { context: ./backend }
    command: ["uv", "run", "python", "-m", "callwise.workers.dialer"]
    environment: *backend-env
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  verification-worker:
    build: { context: ./backend }
    command: ["uv", "run", "python", "-m", "callwise.workers.verification"]
    environment: *backend-env
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  reconciler:
    build: { context: ./backend }
    command: ["uv", "run", "python", "-m", "callwise.workers.reconciler"]
    environment: *backend-env
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  frontend:
    build: { context: ./frontend }
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      control-api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
