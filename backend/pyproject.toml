[project]
name = "callwise"
version = "0.1.0"
description = "Callwise — AI voice-agent platform (production engine)"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Exact pins — single source of truth, resolved into uv.lock (PRD §14.6).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "email-validator==2.2.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "hiredis==3.1.0",
    "httpx==0.28.1",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",
    "phonenumbers==8.13.52",
    "tzdata==2024.2",
    "structlog==24.4.0",
    "orjson==3.10.13",
    "prometheus-client==0.22.1",
    "opentelemetry-sdk==1.39.0",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-exporter-otlp==1.39.0",
    "tenacity==9.0.0",
    "aioboto3==13.3.0",
]

[project.optional-dependencies]
# Provider SDKs are opt-in extras so the core stays light and conflict-free.
# Default runtime uses the "mock" providers and needs none of these.
telephony = ["twilio==9.4.1"]
# LiveKit real-time agent path (Soniox STT → LLM → ElevenLabs TTS). The ElevenLabs ConvAI
# path needs no SDK — we parse its webhooks + verify HMAC directly.
conversation = ["livekit-agents[soniox,elevenlabs,silero,openai]~=1.5"]
llm = ["anthropic==0.42.0", "openai==2.41.0"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "anyio==4.7.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callwise"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these callables as argument defaults by design (Depends/Query/etc.).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

# Pragmatic to start: a fresh scaffold has many bare generics and unfilled bodies.
# Tighten toward strict as the implementation lands (PRD §17, Phase 0 hardening).
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
