# Redis — cache, locks, rate-limit buckets, session state, and the Streams broker.
# AOF on for durability so the Pending Entries List (in-flight tasks) survives a restart
# (PRD §8.1, §12.3 edge #31). In production this runs as ElastiCache cluster mode.

appendonly yes
appendfsync everysec

# Keep some memory headroom; evict only volatile keys (never the streams/PEL).
maxmemory-policy volatile-lru

# Streams / PEL recovery is handled in-app via XAUTOCLAIM; no special config needed here.
save 900 1
save 300 10
