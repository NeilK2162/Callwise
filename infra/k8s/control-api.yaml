# Control-plane API — HPA on CPU + RPS, 2–10 replicas (PRD §15.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  labels: { app: control-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: control-api }
  template:
    metadata:
      labels: { app: control-api }
    spec:
      containers:
        - name: control-api
          image: callwise/backend:latest
          command: ["uv", "run", "uvicorn", "callwise.control_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: callwise-config }
            - secretRef: { name: callwise-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
spec:
  selector: { app: control-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: control-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
