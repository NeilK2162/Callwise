# Example ConfigMap + Secret. In production, the Secret is sourced from AWS Secrets
# Manager / SSM (e.g. via External Secrets Operator) — never committed (PRD §14.5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: callwise-config
data:
  APP_ENV: "prod"
  LOG_LEVEL: "INFO"
  BASE_URL: "https://hooks.callwise.example.com"
  DATABASE_URL: "postgresql+asyncpg://callwise@pgbouncer:6432/callwise"
  DATABASE_URL_DIRECT: "postgresql+asyncpg://callwise@postgres-primary:5432/callwise"
  REDIS_URL: "redis://redis-cluster:6379/0"
  S3_BUCKET: "callwise-prod"
  S3_REGION: "ap-south-1"
  TELEPHONY_PROVIDER: "exotel"
  CONVERSATION_PROVIDER: "elevenlabs"
  LLM_PROVIDER: "azure_openai"
  GLOBAL_MAX_CONCURRENT_CALLS: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: callwise-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-32+-char-secret-from-secrets-manager"
  CONTEXT_TOKEN_SECRET: "replace-with-32+-char-secret-from-secrets-manager"
  # DATABASE_URL/REDIS_URL passwords, provider API keys, ELEVENLABS_WEBHOOK_SECRET, etc.
