; PgBouncer — transaction pooling (PRD §15.3). The non-negotiable: at thousands of
; concurrent tasks, raw Postgres connections exhaust instantly. Transaction-mode pooling
; multiplexes thousands of client connections onto a small pool of real Postgres conns.
;
; App side MUST set statement_cache_size=0 on asyncpg (see backend/src/callwise/db/base.py),
; because prepared-statement caching corrupts the protocol behind transaction pooling.

[databases]
callwise = host=postgres-primary port=5432 dbname=callwise

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 60

; Reports run against the read replica via a second [databases] entry in production:
; callwise_ro = host=postgres-replica port=5432 dbname=callwise
